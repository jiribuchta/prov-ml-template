# @package _global_
# Register the files in data_path as a dataset (in place — nothing is copied).
metadata:
  run_name: register_dataset

pipeline:
  step: register_dataset
  # The one csv with the slide paths — e.g. the cohort table that ships with
  # the data. A column named path / slide / file / wsi_path (or the table's
  # only column) holds the paths (absolute, or relative to data_path).
  # Labels are not registered — they stay in the cohort csv itself.
  source: samples.csv
