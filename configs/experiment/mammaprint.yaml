# @package _global_
defaults:
  - _self_

# Your dataset: copy this file, fill in the ???s, rename to e.g. mammaprint.yaml,
# and run steps with +experiment=<name> (scripts/_submit.py: EXPERIMENT).
metadata:
  experiment_name: Dataset Mammaprint # MLflow experiment all pipeline steps log to
  description: dataset init # shown as the MLflow run note

# Folder with the data files (registered in place — nothing is copied).
data_path: /mnt/data/MOU/breast/mammaprint # e.g. /mnt/data/projects/.../mammaprint

pipeline:
  # One csv with the slide paths (see configs/pipeline/register_dataset.yaml)
  # — e.g. the cohort table that ships with the data:
  source: slides.csv

dataset:
  name: mammaprint # e.g. mammaprint
  version: 1.0.0
  # The registration run defining this dataset — required, paste the
  # [hint] line printed by register_dataset (no latest-run fallback).
  run_id: null
  # Upstream runs — required, paste the [hint] line printed by each step;
  # a config always names the exact runs it consumed.
  mlflow_uris:
    split_dataset: null # e.g. runs:/<run_id>/train.csv
    embed_dataset: null # e.g. runs:/<run_id>/embeddings/train.csv
