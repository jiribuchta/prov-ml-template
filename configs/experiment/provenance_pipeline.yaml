# @package _global_
defaults:
  - _self_

# Toy end-to-end demo of the provenance pipeline:
# create_user → register_dataset → split_dataset → embed_dataset → learn.
metadata:
  experiment_name: Provenance Pipeline
  description: |
    Toy pipeline demonstrating rationai-provenance:
    dataset registration and verification, chained steps, upstream input tracking.

dataset:
  name: toy-blobs
  version: 1.0.0
  # The registration run defining this dataset — required, paste the
  # [hint] line printed by register_dataset (no latest-run fallback).
  run_id: null
  # Upstream runs — required, paste the [hint] line printed by each step;
  # a config always names the exact runs it consumed.
  mlflow_uris:
    split_dataset: null # e.g. mlflow-artifacts:/<exp_id>/<run_id>/artifacts/train.csv
    embed_dataset: null # e.g. mlflow-artifacts:/<exp_id>/<run_id>/artifacts/embeddings/train.csv
