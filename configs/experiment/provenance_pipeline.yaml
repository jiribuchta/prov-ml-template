# @package _global_
defaults:
  - _self_

# Toy end-to-end demo of the provenance pipeline:
# create_user → register_dataset → split_dataset → embed_dataset → learn.
metadata:
  experiment_name: Provenance Pipeline
  description: |
    Toy pipeline demonstrating rationai-provenance:
    dataset registration and verification, chained steps, upstream input tracking.

dataset:
  name: toy-blobs
  version: 1.0.0
  # Pin upstream runs to freeze the chain (URIs are printed by each step);
  # null = automatically use the latest finished run of the upstream step.
  mlflow_uris:
    split_dataset: null # e.g. runs:/<run_id>/train.csv
    embed_dataset: null # e.g. runs:/<run_id>/embeddings/train.csv
