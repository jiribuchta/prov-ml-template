[project]
name = "provenance-pipeline"
version = "0.1.0"
authors = []
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "hydra-core>=1.3.2",
    "lightning>=2.4.0",
    "mlflow>=3.10.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "rationai-mlkit",
    "rationai-provenance",
    "scikit-learn>=1.4",
    "torch>=2.9.0",
]

[project.optional-dependencies]
job = ["rationai-kube-jobs"]

[tool.uv.sources]
rationai-kube-jobs = { git = "ssh://git@gitlab.ics.muni.cz/rationai/infrastructure/kube-jobs", branch = "feature/job-env-metadata" }
rationai-mlkit = { git = "https://github.com/RationAI/mlkit.git" }
rationai-provenance = { git = "ssh://git@github.com/RationAI/provenance.git" }

[dependency-groups]
dev = ["mypy", "ruff"]
