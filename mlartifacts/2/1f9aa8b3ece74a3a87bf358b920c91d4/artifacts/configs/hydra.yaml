run:
  dir: .
sweep:
  dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
  subdir: ${hydra.job.num}
launcher:
  _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
sweeper:
  _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
  max_batch_size: null
  params: null
help:
  app_name: ${hydra.job.name}
  header: '${hydra.help.app_name} is powered by Hydra.

    '
  footer: 'Powered by Hydra (https://hydra.cc)

    Use --hydra-help to view Hydra specific help

    '
  template: '${hydra.help.header}

    == Configuration groups ==

    Compose your configuration from those groups (group=option)


    $APP_CONFIG_GROUPS


    == Config ==

    Override anything in the config (foo.bar=value)


    $CONFIG


    ${hydra.help.footer}

    '
hydra_help:
  template: 'Hydra (${hydra.runtime.version})

    See https://hydra.cc for more info.


    == Flags ==

    $FLAGS_HELP


    == Configuration groups ==

    Compose your configuration from those groups (For example, append hydra/job_logging=disabled
    to command line)


    $HYDRA_CONFIG_GROUPS


    Use ''--cfg hydra'' to Show the Hydra config.

    '
  hydra_help: ???
hydra_logging:
  version: 1
  root:
    level: ERROR
  disable_existing_loggers: true
job_logging:
  version: 1
  formatters:
    simple:
      format: '%(message)s'
  handlers:
    console:
      class: logging.StreamHandler
      formatter: simple
      stream: ext://sys.stdout
  root:
    handlers:
    - console
  disable_existing_loggers: false
env: {}
mode: RUN
searchpath: []
callbacks: {}
output_subdir: null
overrides:
  hydra:
  - hydra.mode=RUN
  task:
  - pipeline=embed_dataset
  - +experiment=mammaprint
  - dataset.run_id=4a59c13604d342178c0a8039acc6a81c
  - data_path=data/demo
  - dataset.mlflow_uris.split_dataset=runs:/4c9e27948a004fff9b146b7e26610385/train.csv
job:
  name: __main__
  chdir: null
  override_dirname: +experiment=mammaprint,data_path=data/demo,dataset.mlflow_uris.split_dataset=runs:/4c9e27948a004fff9b146b7e26610385/train.csv,dataset.run_id=4a59c13604d342178c0a8039acc6a81c,pipeline=embed_dataset
  id: ???
  num: ???
  config_name: pipeline
  env_set: {}
  env_copy: []
  config:
    override_dirname:
      kv_sep: '='
      item_sep: ','
      exclude_keys: []
runtime:
  version: 1.3.8
  version_base: '1.3'
  cwd: /home/novby/Documents/rationAI/prov-ml-template
  config_sources:
  - path: hydra.conf
    schema: pkg
    provider: hydra
  - path: /home/novby/Documents/rationAI/prov-ml-template/configs
    schema: file
    provider: main
  - path: ''
    schema: structured
    provider: schema
  output_dir: /home/novby/Documents/rationAI/prov-ml-template
  choices:
    experiment: mammaprint
    pipeline: embed_dataset
    logger: mlflow
    hydra: default
    hydra/env: default
    hydra/callbacks: null
    hydra/job_logging: custom
    hydra/hydra_logging: disabled
    hydra/hydra_help: default
    hydra/help: default
    hydra/sweeper: basic
    hydra/launcher: basic
    hydra/output: default
verbose: false
